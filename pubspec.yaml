name: neo_connection_health
description: Pure Dart package that monitors device internet connectivity and a specific server's reachability, exposing real-time state via a Stream.
# 0.2.0, not 0.1.1: `ConnectionHealthState` gained `weakNetwork`, which
# breaks any consumer with an exhaustive switch. Under semver's 0.x rules
# the minor is the breaking slot.
version: 0.2.0
# repository: https://github.com/my_org/my_repo

environment:
  # Match the consumer app (neo) floor. The code uses nothing past Dart
  # 2.19 (Stream.multi); pinning to the dev-machine SDK would raise neo's
  # effective floor and break `flutter pub get` on any older toolchain.
  sdk: ^3.5.4

# Add regular dependencies here.
dependencies:
  # Used only for `clock.now()` in the probe-latency measurement, so
  # `fake_async` can drive it in tests (it fakes Clock, never Stopwatch).
  clock: ^1.1.1
  http: ^1.2.0
  internet_connection_checker_plus: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  fake_async: ^1.3.0
